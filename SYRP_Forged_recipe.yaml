- action: write_file
  file: ./resources/[syrp]/syrp_ui/html/style.css
  data: |
    :root { --steel:#111820; --panel:rgba(12,17,23,.88); --line:#77889b; --white:#f4f7fa; --green:#66d17a; --red:#ff6b6b; --amber:#ffc857; }
    *{box-sizing:border-box} body{margin:0;overflow:hidden;font-family:Inter,Arial,sans-serif;color:var(--white);user-select:none}
    #hud{position:fixed;right:2.2vw;top:3vh;width:240px;background:var(--panel);border:1px solid rgba(255,255,255,.12);border-left:4px solid #b8c2cc;padding:12px 14px;border-radius:8px;box-shadow:0 8px 35px rgba(0,0,0,.35)}
    .hidden{display:none}.brand{font-weight:900;letter-spacing:2px;font-size:15px;margin-bottom:8px}.brand span{font-weight:500;color:#9fb0c2}.row{display:flex;justify-content:space-between;align-items:center;padding:5px 0;border-top:1px solid rgba(255,255,255,.06)}.row b{font-size:18px}.row small{font-size:9px;letter-spacing:1.7px;color:#9fb0c2}.job{display:flex;justify-content:space-between;gap:8px;padding-top:7px;text-transform:uppercase;font-size:10px;letter-spacing:1px}.job i{font-style:normal;color:var(--red)}.job i.on{color:var(--green)}
    #notices{position:fixed;right:2.2vw;top:190px;width:310px;display:flex;flex-direction:column;gap:8px}.notice{background:var(--panel);padding:11px 13px;border-radius:6px;border-left:4px solid #8fa0b3;animation:in .18s ease}.notice.success{border-color:var(--green)}.notice.error{border-color:var(--red)}.notice.warn{border-color:var(--amber)}
    #announce{position:fixed;left:50%;top:7vh;transform:translateX(-50%);max-width:650px;padding:14px 24px;background:rgba(10,14,19,.94);border:1px solid rgba(255,255,255,.2);border-radius:8px;font-weight:800;letter-spacing:.5px;display:none;text-align:center}
    @keyframes in{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:none}}
- action: write_file
  file: ./resources/[syrp]/syrp_vehicles/client.lua
  data: |
    local function closestVehicle(radius)
        local ped=PlayerPedId()
        if IsPedInAnyVehicle(ped,false) then return GetVehiclePedIsIn(ped,false) end
        local c=GetEntityCoords(ped)
        return GetClosestVehicle(c.x,c.y,c.z,radius or 7.0,0,71)
    end
    RegisterCommand('engine',function()
        local veh=closestVehicle(2.0); if veh==0 or GetPedInVehicleSeat(veh,-1)~=PlayerPedId() then return TriggerEvent('syrp:ui:notify','You must be in the driver seat.','error') end
        local on=GetIsVehicleEngineRunning(veh); SetVehicleEngineOn(veh,not on,false,true); TriggerEvent('syrp:ui:notify',not on and 'Engine started.' or 'Engine stopped.','info')
    end)
    RegisterCommand('lock',function()
        local veh=closestVehicle(7.0); if veh==0 then return TriggerEvent('syrp:ui:notify','No vehicle nearby.','error') end
        local state=GetVehicleDoorLockStatus(veh); local lock=(state~=2)
        SetVehicleDoorsLocked(veh,lock and 2 or 1); SetVehicleDoorsLockedForAllPlayers(veh,lock)
        PlayVehicleDoorCloseSound(veh,1); TriggerEvent('syrp:ui:notify',lock and 'Vehicle locked.' or 'Vehicle unlocked.','info')
    end)
    RegisterKeyMapping('lock','Lock / unlock nearby vehicle','keyboard','L')
- action: write_file
  file: ./resources/[syrp]/syrp_vehicles/fxmanifest.lua
  data: |
    fx_version 'cerulean'
    game 'gta5'
