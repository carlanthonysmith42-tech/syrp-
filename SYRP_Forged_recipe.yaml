$engine: 3
$onesync: 'on'
name: SYRP Forged
version: 1.0.0-forged
author: Smithy / SYRP
description: A unique South Yorkshire-inspired standalone RP base with custom core, HUD, dispatch, services, jobs, interactions
  and admin tools.
tasks:
- action: download_github
  src: https://github.com/citizenfx/cfx-server-data
  ref: master
  subpath: resources
  dest: ./tmp
- action: ensure_dir
  path: ./resources
- action: move_path
  src: ./tmp/[gamemodes]/basic-gamemode/
  dest: ./resources/basic-gamemode/
- action: move_path
  src: ./tmp/[managers]/mapmanager/
  dest: ./resources/mapmanager/
- action: move_path
  src: ./tmp/[managers]/spawnmanager/
  dest: ./resources/spawnmanager/
- action: move_path
  src: ./tmp/[gamemodes]/[maps]/fivem-map-hipster/
  dest: ./resources/[maps]/fivem-map-hipster/
- action: move_path
  src: ./tmp/[gamemodes]/[maps]/fivem-map-skater/
  dest: ./resources/[maps]/fivem-map-skater/
- action: remove_path
  path: ./tmp
- action: write_file
  file: ./server.cfg
  data: |
    # ================================================================
    # South Yorkshire Roleplay - Forged Framework
    # Fully custom standalone base generated for txAdmin
    # ================================================================

    sv_hostname "{{serverName}} | South Yorkshire Roleplay"
    sets sv_projectName "[SYRP] {{serverName}}"
    sets sv_projectDesc "{{recipeDescription}}"
    sets tags "roleplay, uk, south-yorkshire, custom, standalone, syrp"
    sets locale "en-GB"

    sv_licenseKey "{{svLicense}}"
    sv_maxclients {{maxClients}}
    {{serverEndpoints}}

    # Modern system chat support for any resources that choose to use it.
    set resources_useSystemChat true

    # CFX base resources
    ensure mapmanager
    ensure spawnmanager
    ensure basic-gamemode

    # SYRP Forged Framework - start order matters
    ensure syrp_core
    ensure syrp_ui
    ensure syrp_loadscreen
    ensure syrp_spawn
    ensure syrp_dispatch
    ensure syrp_services
    ensure syrp_jobs
    ensure syrp_vehicles
    ensure syrp_interact
    ensure syrp_admin

    # txAdmin / ACE integration
    add_ace group.admin command allow
    add_ace group.admin command.quit deny
    add_ace group.admin syrp.admin allow
    add_ace group.admin syrp.police allow
    add_ace group.admin syrp.ems allow
    {{addPrincipalsMaster}}

    # Optional examples (replace the identifier before using):
    # add_principal identifier.license:YOUR_LICENSE_HERE group.admin
    # add_ace identifier.license:YOUR_LICENSE_HERE syrp.police allow
    # add_ace identifier.license:YOUR_LICENSE_HERE syrp.ems allow
- action: write_file
  file: ./resources/[syrp]/README.md
  data: |
    # SYRP Forged Framework resources

    These resources are original standalone scripts and do not require ESX, QBCore, Qbox, ox_lib or a SQL server.

    Start order:
    1. `syrp_core`
    2. `syrp_ui`
    3. `syrp_loadscreen`
    4. `syrp_spawn`
    5. `syrp_dispatch`
    6. `syrp_services`
    7. `syrp_jobs`
    8. `syrp_vehicles`
    9. `syrp_interact`
    10. `syrp_admin`

    Persistent player records are stored by `syrp_core` in `data/players.json`. For a larger production server, migrate the storage layer to MySQL while keeping the exports/API stable.
- action: write_file
  file: ./resources/[syrp]/syrp_admin/client.lua
  data: |
    RegisterNetEvent('syrp:admin:teleport',function(x,y,z)
        local ped=PlayerPedId(); DoScreenFadeOut(200); Wait(250); SetEntityCoordsNoOffset(ped,x+0.0,y+0.0,z+0.5,false,false,false); Wait(250); DoScreenFadeIn(300)
    end)
- action: write_file
  file: ./resources/[syrp]/syrp_admin/fxmanifest.lua
  data: |
    fx_version 'cerulean'
    game 'gta5'
    name 'syrp_admin'
    author 'SYRP Forged Framework'
    version '1.0.0'
    client_script 'client.lua'
    server_script 'server.lua'
- action: write_file
  file: ./resources/[syrp]/syrp_admin/server.lua
  data: |
    local reports, nextReport = {}, 0
    local function admin(src) return IsPlayerAceAllowed(src,'syrp.admin') end
    local function n(src,msg,kind) exports.syrp_core:Notify(src,msg,kind or 'info') end
    local function argsText(args,start)
        local t={}; for i=start or 1,#args do t[#t+1]=args[i] end; return table.concat(t,' ')
    end

    RegisterCommand('announce',function(src,args)
        if src~=0 and not admin(src) then return end
        local msg=argsText(args,1); if msg=='' then return end
        TriggerClientEvent('syrp:ui:announce',-1,msg)
    end,false)

    RegisterCommand('report',function(src,args)
        if src==0 then return end
        local msg=argsText(args,1):sub(1,220); if msg=='' then return n(src,'Usage: /report <message>','error') end
        nextReport=nextReport+1; reports[nextReport]={id=nextReport,src=src,name=GetPlayerName(src) or 'Unknown',message=msg,time=os.time()}
        n(src,('Report #%d submitted.'):format(nextReport),'success')
        for _,id in ipairs(GetPlayers()) do local a=tonumber(id); if admin(a) then n(a,('REPORT #%d | %s (%d): %s'):format(nextReport,reports[nextReport].name,src,msg),'warn') end end
    end,false)

    RegisterCommand('reports',function(src)
        if src~=0 and not admin(src) then return end
        local count=0; for _,r in pairs(reports) do count=count+1; if src~=0 then n(src,('#%d | %s (%d): %s'):format(r.id,r.name,r.src,r.message),'info') end end
        if src~=0 and count==0 then n(src,'No open reports.','info') end
    end,false)

    RegisterCommand('closereport',function(src,args)
        if src~=0 and not admin(src) then return end
        local id=tonumber(args[1]); if id and reports[id] then reports[id]=nil; if src~=0 then n(src,'Report closed.','success') end end
    end,false)

    RegisterCommand('setjob',function(src,args)
        if src~=0 and not admin(src) then return end
        local target=tonumber(args[1]); local job=tostring(args[2] or ''); local grade=tonumber(args[3]) or 0
        if not target or not exports.syrp_core:SetJob(target,job,grade) then if src~=0 then n(src,'Usage: /setjob ID citizen|police|ems|mechanic|council GRADE','error') end return end
        if src~=0 then n(src,('Job updated for ID %d.'):format(target),'success') end; n(target,('Your job is now %s (grade %d).'):format(job,grade),'success')
    end,false)

    RegisterCommand('givemoney',function(src,args)
        if src~=0 and not admin(src) then return end
        local target=tonumber(args[1]); local account=tostring(args[2] or ''); local amount=math.floor(tonumber(args[3]) or 0)
        if not target or amount<=0 or not exports.syrp_core:AddMoney(target,account,amount) then if src~=0 then n(src,'Usage: /givemoney ID cash|bank AMOUNT','error') end return end
        n(target,('Admin added £%d to your %s.'):format(amount,account),'success')
    end,false)

    RegisterCommand('goto',function(src,args)
        if src==0 or not admin(src) then return end
        local target=tonumber(args[1]); if not target then return end
        local ped=GetPlayerPed(target); if ped==0 then return end
        local c=GetEntityCoords(ped); TriggerClientEvent('syrp:admin:teleport',src,c.x,c.y,c.z)
    end,false)
    RegisterCommand('bring',function(src,args)
        if src==0 or not admin(src) then return end
        local target=tonumber(args[1]); if not target then return end
        local ped=GetPlayerPed(src); if ped==0 then return end
        local c=GetEntityCoords(ped); TriggerClientEvent('syrp:admin:teleport',target,c.x,c.y,c.z)
    end,false)
- action: write_file
  file: ./resources/[syrp]/syrp_core/client.lua
  data: |
    local PlayerData = nil

    exports('GetData', function() return PlayerData end)

    RegisterNetEvent('syrp:client:data', function(data)
        PlayerData = data
        TriggerEvent('syrp:client:dataUpdated', data)
    end)

    RegisterNetEvent('syrp:client:notify', function(message, kind)
        TriggerEvent('syrp:ui:notify', message, kind or 'info')
    end)

    CreateThread(function()
        while not NetworkIsPlayerActive(PlayerId()) do Wait(250) end
        TriggerServerEvent('syrp:server:requestPlayer')
        Wait(1000)
        ShutdownLoadingScreen()
        ShutdownLoadingScreenNui()
    end)

    RegisterCommand('cash', function()
        if PlayerData then TriggerEvent('syrp:ui:notify', ('Cash: £%d'):format(PlayerData.cash or 0), 'info') end
    end)

    RegisterCommand('bank', function()
        if PlayerData then TriggerEvent('syrp:ui:notify', ('Bank: £%d'):format(PlayerData.bank or 0), 'info') end
    end)

    RegisterCommand('job', function()
        if PlayerData then
            TriggerEvent('syrp:ui:notify', ('Job: %s | Grade %d | %s duty'):format(PlayerData.job, PlayerData.grade or 0, PlayerData.duty and 'ON' or 'OFF'), 'info')
        end
    end)

    RegisterCommand('duty', function() TriggerServerEvent('syrp:server:toggleDuty') end)
    RegisterCommand('pay', function(_, args)
        TriggerServerEvent('syrp:server:payPlayer', tonumber(args[1]), tonumber(args[2]))
    end)
- action: write_file
  file: ./resources/[syrp]/syrp_core/config.lua
  data: |
    SYRP = SYRP or {}
    SYRP.Config = {
        ServerLabel = 'South Yorkshire Roleplay',
        StartingCash = 750,
        StartingBank = 5000,
        SaveIntervalMs = 60000,
        MaxTransfer = 100000,
        Jobs = {
            citizen = { label = 'Citizen' },
            police = { label = 'South Yorkshire Police' },
            ems = { label = 'Yorkshire Ambulance Service' },
            mechanic = { label = 'Steel City Motors' },
            council = { label = 'Council Services' },
        }
    }
- action: write_file
  file: ./resources/[syrp]/syrp_core/data/players.json
  data: |
    {}
- action: write_file
  file: ./resources/[syrp]/syrp_core/fxmanifest.lua
  data: |
    fx_version 'cerulean'
    game 'gta5'

    name 'syrp_core'
    author 'SYRP Forged Framework'
    description 'Standalone player state, persistence, jobs and economy core.'
    version '1.0.0'

    shared_script 'config.lua'
    client_script 'client.lua'
    server_script 'server.lua'
- action: write_file
  file: ./resources/[syrp]/syrp_core/server.lua
  data: |
    local RESOURCE = GetCurrentResourceName()
    local STORE_FILE = 'data/players.json'
    local Players = {}
    local Store = {}

    local function notify(src, message, kind)
        TriggerClientEvent('syrp:client:notify', src, tostring(message), kind or 'info')
    end

    local function getIdentifier(src)
        for _, identifier in ipairs(GetPlayerIdentifiers(src)) do
            if identifier:sub(1, 8) == 'license:' then
                return identifier
            end
        end
        return ('session:%s'):format(src)
    end

    local function saveStore()
        SaveResourceFile(RESOURCE, STORE_FILE, json.encode(Store), -1)
    end

    local function defaultPlayer(src, identifier)
        return {
            identifier = identifier,
            name = GetPlayerName(src) or 'Unknown',
            cash = SYRP.Config.StartingCash,
            bank = SYRP.Config.StartingBank,
            job = 'citizen',
            grade = 0,
            duty = false,
            created = os.time(),
            last_seen = os.time()
        }
    end

    local function sanitizePlayer(data, src, identifier)
        local base = defaultPlayer(src, identifier)
        if type(data) ~= 'table' then return base end
        base.name = GetPlayerName(src) or data.name or base.name
        base.cash = math.max(0, math.floor(tonumber(data.cash) or base.cash))
        base.bank = math.max(0, math.floor(tonumber(data.bank) or base.bank))
        base.job = SYRP.Config.Jobs[data.job] and data.job or 'citizen'
        base.grade = math.max(0, math.floor(tonumber(data.grade) or 0))
        base.duty = data.duty == true
        base.created = tonumber(data.created) or base.created
        base.last_seen = os.time()
        return base
    end

    local function push(src)
        if Players[src] then
            TriggerClientEvent('syrp:client:data', src, Players[src])
        end
    end

    local function loadPlayer(src)
        src = tonumber(src)
        if not src then return end
        local identifier = getIdentifier(src)
        local data = sanitizePlayer(Store[identifier], src, identifier)
        Players[src] = data
        Store[identifier] = data
        push(src)
    end

    local function savePlayer(src)
        src = tonumber(src)
        local data = src and Players[src]
        if not data then return end
        data.last_seen = os.time()
        Store[data.identifier] = data
    end

    local function setMoney(src, account, amount)
        local p = Players[tonumber(src)]
        amount = math.floor(tonumber(amount) or -1)
        if not p or (account ~= 'cash' and account ~= 'bank') or amount < 0 then return false end
        p[account] = amount
        savePlayer(src)
        push(src)
        return true
    end

    local function addMoney(src, account, amount)
        local p = Players[tonumber(src)]
        amount = math.floor(tonumber(amount) or 0)
        if not p or amount <= 0 or (account ~= 'cash' and account ~= 'bank') then return false end
        return setMoney(src, account, p[account] + amount)
    end

    local function removeMoney(src, account, amount)
        local p = Players[tonumber(src)]
        amount = math.floor(tonumber(amount) or 0)
        if not p or amount <= 0 or (account ~= 'cash' and account ~= 'bank') then return false end
        if p[account] < amount then return false end
        return setMoney(src, account, p[account] - amount)
    end

    local function setJob(src, job, grade)
        local p = Players[tonumber(src)]
        if not p or not SYRP.Config.Jobs[job] then return false end
        p.job = job
        p.grade = math.max(0, math.floor(tonumber(grade) or 0))
        p.duty = false
        savePlayer(src)
        push(src)
        return true
    end

    local function setDuty(src, state)
        local p = Players[tonumber(src)]
        if not p then return false end
        if p.job ~= 'police' and p.job ~= 'ems' and p.job ~= 'mechanic' and p.job ~= 'council' then
            return false
        end
        p.duty = state == true
        savePlayer(src)
        push(src)
        return true
    end

    exports('GetPlayer', function(src) return Players[tonumber(src)] end)
    exports('GetPlayers', function() return Players end)
    exports('SetMoney', setMoney)
    exports('AddMoney', addMoney)
    exports('RemoveMoney', removeMoney)
    exports('SetJob', setJob)
    exports('SetDuty', setDuty)
    exports('Notify', notify)

    AddEventHandler('onResourceStart', function(resource)
        if resource ~= RESOURCE then return end
        local raw = LoadResourceFile(RESOURCE, STORE_FILE)
        if raw and raw ~= '' then
            local ok, decoded = pcall(json.decode, raw)
            if ok and type(decoded) == 'table' then Store = decoded end
        end
        for _, id in ipairs(GetPlayers()) do loadPlayer(tonumber(id)) end
    end)

    AddEventHandler('playerJoining', function()
        local src = source
        SetTimeout(750, function()
            if GetPlayerName(src) then loadPlayer(src) end
        end)
    end)

    AddEventHandler('playerDropped', function()
        local src = source
        savePlayer(src)
        saveStore()
        Players[src] = nil
    end)

    RegisterNetEvent('syrp:server:requestPlayer', function()
        local src = source
        if not Players[src] then loadPlayer(src) else push(src) end
    end)

    RegisterNetEvent('syrp:server:toggleDuty', function()
        local src = source
        local p = Players[src]
        if not p then return end
        if setDuty(src, not p.duty) then
            notify(src, ('You are now %s duty as %s.'):format(Players[src].duty and 'ON' or 'OFF', SYRP.Config.Jobs[p.job].label), Players[src].duty and 'success' or 'info')
        else
            notify(src, 'Your current job does not use duty status.', 'error')
        end
    end)

    RegisterNetEvent('syrp:server:payPlayer', function(target, amount)
        local src = source
        target = tonumber(target)
        amount = math.floor(tonumber(amount) or 0)
        if not target or not Players[target] or amount <= 0 or amount > SYRP.Config.MaxTransfer then
            return notify(src, 'Invalid player or amount.', 'error')
        end
        local srcPed, targetPed = GetPlayerPed(src), GetPlayerPed(target)
        if srcPed == 0 or targetPed == 0 then return end
        local distance = #(GetEntityCoords(srcPed) - GetEntityCoords(targetPed))
        if distance > 5.0 then return notify(src, 'That player is too far away.', 'error') end
        if not removeMoney(src, 'cash', amount) then return notify(src, 'You do not have enough cash.', 'error') end
        addMoney(target, 'cash', amount)
        notify(src, ('Paid £%d to ID %d.'):format(amount, target), 'success')
        notify(target, ('You received £%d from ID %d.'):format(amount, src), 'success')
    end)

    CreateThread(function()
        while true do
            Wait(SYRP.Config.SaveIntervalMs)
            for src in pairs(Players) do savePlayer(src) end
            saveStore()
        end
    end)
- action: write_file
  file: ./resources/[syrp]/syrp_dispatch/client.lua
  data: |
    local calls = {}
    local showing = false

    local function text(x,y,scale,msg)
        SetTextFont(4); SetTextScale(scale,scale); SetTextColour(245,248,250,235); SetTextOutline(); SetTextEntry('STRING'); AddTextComponentString(msg); DrawText(x,y)
    end

    RegisterNetEvent('syrp:dispatch:new', function(call)
        calls[call.id] = call
        TriggerEvent('syrp:ui:notify', ('[%s] Call %d: %s'):format(call.kind, call.id, call.message), call.kind == '999' and 'error' or 'warn')
    end)
    RegisterNetEvent('syrp:dispatch:update', function(call) calls[call.id]=call end)
    RegisterNetEvent('syrp:dispatch:removed', function(id) calls[tonumber(id)]=nil end)
    RegisterNetEvent('syrp:dispatch:setRoute', function(call)
        SetNewWaypoint(call.x+0.0, call.y+0.0)
        TriggerEvent('syrp:ui:notify', ('Route set to call %d.'):format(call.id), 'success')
    end)

    local function createCall(kind, args)
        local msg = table.concat(args, ' ')
        if msg == '' then return TriggerEvent('syrp:ui:notify', ('Usage: /%s <message>'):format(kind), 'error') end
        local c = GetEntityCoords(PlayerPedId())
        TriggerServerEvent('syrp:dispatch:create', kind, msg, {x=c.x,y=c.y,z=c.z})
    end
    RegisterCommand('999', function(_, args) createCall('999', args) end)
    RegisterCommand('101', function(_, args) createCall('101', args) end)
    RegisterCommand('accept', function(_, args) TriggerServerEvent('syrp:dispatch:accept', tonumber(args[1])) end)
    RegisterCommand('clearcall', function(_, args) TriggerServerEvent('syrp:dispatch:clear', tonumber(args[1])) end)
    RegisterCommand('dispatch', function()
        local d = exports.syrp_core:GetData()
        if not d or not d.duty or (d.job ~= 'police' and d.job ~= 'ems') then return TriggerEvent('syrp:ui:notify','You must be on emergency-service duty.','error') end
        showing = not showing
    end)
    RegisterKeyMapping('dispatch', 'Open/close SYRP dispatch board', 'keyboard', 'G')

    CreateThread(function()
        while true do
            if showing then
                Wait(0)
                DrawRect(.82,.28,.34,.42,8,12,17,215)
                text(.66,.085,.42,'SYRP DISPATCH — G TO CLOSE')
                local list = {}
                for _,call in pairs(calls) do list[#list+1]=call end
                table.sort(list,function(a,b)return a.id>b.id end)
                if #list == 0 then text(.67,.13,.32,'No active calls.') end
                for i=1,math.min(#list,8) do
                    local c=list[i]; local status=c.acceptedBy and (' | UNIT '..c.acceptedBy) or ''
                    text(.67,.11+(i*.038),.28,('[%s] #%d %s%s'):format(c.kind,c.id,c.message:sub(1,42),status))
                end
                text(.67,.455,.25,'/accept ID   /clearcall ID')
            else Wait(350) end
        end
    end)
- action: write_file
  file: ./resources/[syrp]/syrp_dispatch/fxmanifest.lua
  data: |
    fx_version 'cerulean'
    game 'gta5'
    name 'syrp_dispatch'
    author 'SYRP Forged Framework'
    version '1.0.0'
    client_script 'client.lua'
    server_script 'server.lua'
- action: write_file
  file: ./resources/[syrp]/syrp_dispatch/server.lua
  data: |
    local incidents, nextId = {}, 100

    local function servicePlayer(src)
        local p = exports.syrp_core:GetPlayer(src)
        return p and p.duty and (p.job == 'police' or p.job == 'ems'), p
    end

    local function sendToServices(event, payload)
        for _, id in ipairs(GetPlayers()) do
            local src = tonumber(id)
            local ok = servicePlayer(src)
            if ok then TriggerClientEvent(event, src, payload) end
        end
    end

    RegisterNetEvent('syrp:dispatch:create', function(kind, message, coords)
        local src = source
        message = tostring(message or ''):sub(1, 180)
        if message == '' or type(coords) ~= 'table' then return end
        nextId = nextId + 1
        local incident = {
            id=nextId, kind=(kind == '101' and '101' or '999'), message=message,
            caller=GetPlayerName(src) or ('ID '..src), callerId=src,
            x=tonumber(coords.x) or 0.0, y=tonumber(coords.y) or 0.0, z=tonumber(coords.z) or 0.0,
            created=os.time(), acceptedBy=nil
        }
        incidents[incident.id] = incident
        sendToServices('syrp:dispatch:new', incident)
        exports.syrp_core:Notify(src, ('Call %d logged. Emergency services have been notified.'):format(incident.id), 'success')
    end)

    RegisterNetEvent('syrp:dispatch:accept', function(id)
        local src = source
        local ok = servicePlayer(src)
        id = tonumber(id)
        local call = id and incidents[id]
        if not ok or not call then return end
        call.acceptedBy = src
        sendToServices('syrp:dispatch:update', call)
        TriggerClientEvent('syrp:dispatch:setRoute', src, call)
    end)

    RegisterNetEvent('syrp:dispatch:clear', function(id)
        local src = source
        local ok = servicePlayer(src)
        id = tonumber(id)
        if not ok or not incidents[id] then return end
        incidents[id] = nil
        sendToServices('syrp:dispatch:removed', id)
    end)
- action: write_file
  file: ./resources/[syrp]/syrp_interact/client.lua
  data: |
    local target=nil
    local function closestPlayer()
        local me=PlayerPedId(); local mc=GetEntityCoords(me); local best,bestD=nil,3.5
        for _,p in ipairs(GetActivePlayers()) do if p~=PlayerId() then local d=#(mc-GetEntityCoords(GetPlayerPed(p))); if d<bestD then best,bestD=p,d end end end
        return best
    end
    local function open()
        local p=closestPlayer(); if not p then return TriggerEvent('syrp:ui:notify','No player close enough to interact with.','error') end
        target=GetPlayerServerId(p); SetNuiFocus(true,true); SendNUIMessage({action='open',id=target,name=GetPlayerName(p)})
    end
    RegisterCommand('syrp_interact',open)
    RegisterKeyMapping('syrp_interact','Open SYRP nearby-player interaction','keyboard','H')
    RegisterNUICallback('close',function(_,cb)SetNuiFocus(false,false);SendNUIMessage({action='close'});target=nil;cb({ok=true})end)
    RegisterNUICallback('action',function(data,cb)
        if not target then cb({ok=false}) return end
        local a=data.action
        if a=='id' then TriggerEvent('syrp:ui:notify',('Nearby player: %s | ID %d'):format(data.name or 'Unknown',target),'info')
        elseif a=='cuff' then TriggerServerEvent('syrp:services:cuff',target)
        elseif a=='escort' then TriggerServerEvent('syrp:services:escort',target)
        elseif a=='search' then TriggerServerEvent('syrp:services:search',target)
        elseif a=='seat' then TriggerServerEvent('syrp:services:seat',target) end
        cb({ok=true})
    end)
- action: write_file
  file: ./resources/[syrp]/syrp_interact/fxmanifest.lua
  data: |
    fx_version 'cerulean'
    game 'gta5'
    name 'syrp_interact'
    author 'SYRP Forged Framework'
    version '1.0.0'
    client_script 'client.lua'
    ui_page 'html/index.html'
    files { 'html/index.html','html/style.css','html/app.js' }
