- action: write_file
  file: ./resources/[syrp]/syrp_jobs/client.lua
  data: |
    local activeName,step=nil,0
    local function route(name,n)
        activeName,step=name,n; local p=SYRPJobs[name].points[n]; SetNewWaypoint(p.x,p.y)
    end
    RegisterNetEvent('syrp:jobs:route',route)
    RegisterNetEvent('syrp:jobs:stopped',function()activeName=nil;step=0;SetWaypointOff();TriggerEvent('syrp:ui:notify','Public job stopped.','info')end)
    RegisterNetEvent('syrp:jobs:complete',function(pay)activeName=nil;step=0;SetWaypointOff();TriggerEvent('syrp:ui:notify',('Route complete — £%d paid to bank.'):format(pay),'success')end)
    RegisterCommand('work',function(_,a)
        if not a[1] then return TriggerEvent('syrp:ui:notify','Jobs: steelworks | council | courier. Use /work <job> or /work stop.','info') end
        if a[1]=='stop' then TriggerServerEvent('syrp:jobs:stop') else TriggerServerEvent('syrp:jobs:start',string.lower(a[1])) end
    end)
    CreateThread(function()
        while true do
            if activeName then
                local p=SYRPJobs[activeName].points[step]; local c=GetEntityCoords(PlayerPedId()); local dist=#(c-p)
                if dist<45.0 then DrawMarker(1,p.x,p.y,p.z-1.0,0,0,0,0,0,0,2.2,2.2,.8,180,195,210,130,false,false,2,false,nil,nil,false) end
                if dist<2.2 then
                    BeginTextCommandDisplayHelp('STRING');AddTextComponentSubstringPlayerName('Press ~INPUT_CONTEXT~ to complete work checkpoint');EndTextCommandDisplayHelp(0,false,true,-1)
                    if IsControlJustReleased(0,38) then TriggerServerEvent('syrp:jobs:checkpoint'); Wait(1200) end
                end
                Wait(dist<45.0 and 0 or 500)
            else Wait(700) end
        end
    end)
