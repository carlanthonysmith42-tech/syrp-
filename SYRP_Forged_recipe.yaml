- action: write_file
  file: ./resources/[syrp]/syrp_services/client.lua
  data: |
    local isCuffed=false
    local isEscorted=false

    RegisterNetEvent('syrp:services:setCuffed', function(state)
        isCuffed=state==true
        local ped=PlayerPedId()
        if isCuffed then
            RequestAnimDict('mp_arresting'); while not HasAnimDictLoaded('mp_arresting') do Wait(10) end
            TaskPlayAnim(ped,'mp_arresting','idle',8.0,-8.0,-1,49,0,false,false,false)
            SetEnableHandcuffs(ped,true)
        else
            ClearPedTasks(ped); SetEnableHandcuffs(ped,false)
        end
    end)

    RegisterNetEvent('syrp:services:setEscorted', function(state, officer)
        isEscorted=state==true
        local ped=PlayerPedId()
        if not isEscorted then return DetachEntity(ped,true,false) end
        local player=GetPlayerFromServerId(officer)
        if player==-1 then return end
        AttachEntityToEntity(ped,GetPlayerPed(player),11816,0.35,0.45,0.0,0.0,0.0,0.0,false,false,false,false,2,true)
    end)

    RegisterNetEvent('syrp:services:seat', function(officer)
        local op=GetPlayerFromServerId(officer); if op==-1 then return end
        local c=GetEntityCoords(GetPlayerPed(op)); local veh=GetClosestVehicle(c.x,c.y,c.z,7.0,0,71)
        if veh==0 then return TriggerEvent('syrp:ui:notify','No nearby vehicle.','error') end
        if IsPedInAnyVehicle(PlayerPedId(),false) then TaskLeaveVehicle(PlayerPedId(),GetVehiclePedIsIn(PlayerPedId(),false),16)
        else
            for seat=GetVehicleMaxNumberOfPassengers(veh)-1,0,-1 do if IsVehicleSeatFree(veh,seat) then TaskWarpPedIntoVehicle(PlayerPedId(),veh,seat); break end end
        end
    end)

    RegisterNetEvent('syrp:services:revive', function()
        local ped=PlayerPedId(); local c=GetEntityCoords(ped)
        NetworkResurrectLocalPlayer(c.x,c.y,c.z,GetEntityHeading(ped),true,false)
        ClearPedBloodDamage(ped); SetEntityHealth(ped,200)
        TriggerEvent('syrp:ui:notify','You have been revived.','success')
    end)
    RegisterNetEvent('syrp:services:heal', function() SetEntityHealth(PlayerPedId(),200); ClearPedBloodDamage(PlayerPedId()); TriggerEvent('syrp:ui:notify','Treatment complete.','success') end)

    RegisterCommand('cuff',function(_,a)TriggerServerEvent('syrp:services:cuff',tonumber(a[1]))end)
    RegisterCommand('escort',function(_,a)TriggerServerEvent('syrp:services:escort',tonumber(a[1]))end)
    RegisterCommand('search',function(_,a)TriggerServerEvent('syrp:services:search',tonumber(a[1]))end)
    RegisterCommand('seat',function(_,a)TriggerServerEvent('syrp:services:seat',tonumber(a[1]))end)
    RegisterCommand('revive',function(_,a)TriggerServerEvent('syrp:services:revive',tonumber(a[1]))end)
    RegisterCommand('heal',function(_,a)TriggerServerEvent('syrp:services:heal',tonumber(a[1]))end)
    RegisterCommand('help',function(_,a) local msg=#a>0 and table.concat(a,' ') or 'Person requires medical assistance'; local c=GetEntityCoords(PlayerPedId()); TriggerServerEvent('syrp:dispatch:create','999',msg,{x=c.x,y=c.y,z=c.z}) end)

    CreateThread(function()
        while true do
            if isCuffed then
                Wait(0)
                DisableControlAction(0,24,true);DisableControlAction(0,25,true);DisableControlAction(0,22,true);DisableControlAction(0,37,true);DisableControlAction(0,75,true)
                if not IsEntityPlayingAnim(PlayerPedId(),'mp_arresting','idle',3) then TaskPlayAnim(PlayerPedId(),'mp_arresting','idle',8.0,-8.0,-1,49,0,false,false,false) end
            else Wait(400) end
        end
    end)
- action: write_file
  file: ./resources/[syrp]/syrp_services/fxmanifest.lua
  data: |
    fx_version 'cerulean'
    game 'gta5'
    name 'syrp_services'
    author 'SYRP Forged Framework'
    version '1.0.0'
    client_script 'client.lua'
    server_script 'server.lua'
- action: write_file
  file: ./resources/[syrp]/syrp_services/server.lua
  data: |
    local cuffed, escorted = {}, {}

    local function near(a,b,maxDist)
        a,b=tonumber(a),tonumber(b)
        if not a or not b or a==b then return false end
        local ap,bp=GetPlayerPed(a),GetPlayerPed(b)
        if ap==0 or bp==0 then return false end
        return #(GetEntityCoords(ap)-GetEntityCoords(bp)) <= (maxDist or 4.0)
    end
    local function allowed(src, job, ace)
        if IsPlayerAceAllowed(src, ace) then return true end
        local p=exports.syrp_core:GetPlayer(src)
        return p and p.job==job and p.duty==true
    end
    local function bad(src,msg) exports.syrp_core:Notify(src,msg,'error') end

    RegisterNetEvent('syrp:services:cuff', function(target)
        local src=source; target=tonumber(target)
        if not allowed(src,'police','syrp.police') then return bad(src,'Police duty required.') end
        if not target or not near(src,target,4.0) then return bad(src,'Target is too far away.') end
        cuffed[target]=not cuffed[target]
        TriggerClientEvent('syrp:services:setCuffed',target,cuffed[target])
        exports.syrp_core:Notify(src, cuffed[target] and 'Suspect cuffed.' or 'Suspect uncuffed.','success')
    end)

    RegisterNetEvent('syrp:services:escort', function(target)
        local src=source; target=tonumber(target)
        if not allowed(src,'police','syrp.police') then return bad(src,'Police duty required.') end
        if not target or not near(src,target,4.0) then return bad(src,'Target is too far away.') end
        escorted[target]=not escorted[target]
        TriggerClientEvent('syrp:services:setEscorted',target,escorted[target],src)
    end)

    RegisterNetEvent('syrp:services:search', function(target)
        local src=source; target=tonumber(target)
        if not allowed(src,'police','syrp.police') then return bad(src,'Police duty required.') end
        if not target or not near(src,target,4.0) then return bad(src,'Target is too far away.') end
        local p=exports.syrp_core:GetPlayer(target)
        if p then exports.syrp_core:Notify(src, ('ID %d | cash £%d | bank £%d | job %s'):format(target,p.cash,p.bank,p.job),'info') end
    end)

    RegisterNetEvent('syrp:services:seat', function(target)
        local src=source; target=tonumber(target)
        if not allowed(src,'police','syrp.police') then return bad(src,'Police duty required.') end
        if not target or not near(src,target,5.0) then return bad(src,'Target is too far away.') end
        TriggerClientEvent('syrp:services:seat',target,src)
    end)

    RegisterNetEvent('syrp:services:revive', function(target)
        local src=source; target=tonumber(target)
        if not allowed(src,'ems','syrp.ems') then return bad(src,'Ambulance duty required.') end
        if not target or not near(src,target,6.0) then return bad(src,'Target is too far away.') end
        TriggerClientEvent('syrp:services:revive',target)
    end)

    RegisterNetEvent('syrp:services:heal', function(target)
        local src=source; target=tonumber(target)
        if not allowed(src,'ems','syrp.ems') then return bad(src,'Ambulance duty required.') end
        if not target or not near(src,target,6.0) then return bad(src,'Target is too far away.') end
        TriggerClientEvent('syrp:services:heal',target)
    end)

    AddEventHandler('playerDropped', function() cuffed[source]=nil escorted[source]=nil end)
- action: write_file
  file: ./resources/[syrp]/syrp_spawn/client.lua
  data: |
    local opened = false
    local finished = false

    local function openMenu()
        if finished or opened then return end
        opened = true
        SetNuiFocus(true, true)
        local choices = {}
        for _, s in ipairs(SYRPSpawns) do choices[#choices+1] = {id=s.id,label=s.label,subtitle=s.subtitle} end
        SendNUIMessage({ action='open', choices=choices })
    end

    AddEventHandler('playerSpawned', function()
        if not finished then SetTimeout(650, openMenu) end
    end)

    RegisterCommand('spawnmenu', openMenu)

    RegisterNUICallback('choose', function(data, cb)
        local chosen
        for _, s in ipairs(SYRPSpawns) do if s.id == data.id then chosen=s break end end
        if not chosen then cb({ok=false}) return end
        local ped = PlayerPedId()
        DoScreenFadeOut(350)
        while not IsScreenFadedOut() do Wait(0) end
        FreezeEntityPosition(ped, true)
        RequestCollisionAtCoord(chosen.coords.x, chosen.coords.y, chosen.coords.z)
        SetEntityCoordsNoOffset(ped, chosen.coords.x, chosen.coords.y, chosen.coords.z, false, false, false)
        SetEntityHeading(ped, chosen.coords.w)
        Wait(450)
        FreezeEntityPosition(ped, false)
        SetNuiFocus(false, false)
        SendNUIMessage({action='close'})
        opened, finished = false, true
        DoScreenFadeIn(500)
        TriggerEvent('syrp:ui:notify', 'Welcome to '..chosen.label..'.', 'success')
        cb({ok=true})
    end)
