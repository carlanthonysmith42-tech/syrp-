- action: write_file
  file: ./resources/[syrp]/syrp_jobs/server.lua
  data: |
    local active={}

    RegisterNetEvent('syrp:jobs:start', function(name)
        local src=source; local job=SYRPJobs[name]
        if not job then return exports.syrp_core:Notify(src,'Unknown public job.','error') end
        active[src]={name=name,step=1}
        TriggerClientEvent('syrp:jobs:route',src,name,1)
        exports.syrp_core:Notify(src,job.label..' started. Follow the route.','success')
    end)
    RegisterNetEvent('syrp:jobs:stop', function() active[source]=nil; TriggerClientEvent('syrp:jobs:stopped',source) end)
    RegisterNetEvent('syrp:jobs:checkpoint', function()
        local src=source; local a=active[src]; if not a then return end
        local job=SYRPJobs[a.name]; local point=job and job.points[a.step]; if not point then return end
        local ped=GetPlayerPed(src); if ped==0 then return end
        if #(GetEntityCoords(ped)-point)>7.0 then return exports.syrp_core:Notify(src,'Checkpoint rejected: move closer to the work marker.','error') end
        a.step=a.step+1
        if a.step>#job.points then
            active[src]=nil; exports.syrp_core:AddMoney(src,'bank',job.pay); TriggerClientEvent('syrp:jobs:complete',src,job.pay)
        else TriggerClientEvent('syrp:jobs:route',src,a.name,a.step) end
    end)
    AddEventHandler('playerDropped',function()active[source]=nil end)
