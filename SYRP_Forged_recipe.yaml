    const money=n=>Number(n||0).toLocaleString('en-GB');
    window.addEventListener('message',e=>{const m=e.data||{};
     if(m.action==='playerData'&&m.data){hud.classList.remove('hidden');document.getElementById('cash').textContent=money(m.data.cash);document.getElementById('bank').textContent=money(m.data.bank);document.getElementById('job').textContent=m.data.job||'citizen';const d=document.getElementById('duty');d.textContent=m.data.duty?'ON DUTY':'OFF DUTY';d.classList.toggle('on',!!m.data.duty)}
     if(m.action==='notify'){const n=document.createElement('div');n.className='notice '+(m.kind||'info');n.textContent=m.message||'';notices.appendChild(n);setTimeout(()=>n.remove(),5000)}
     if(m.action==='announce'){announce.textContent='SERVER ANNOUNCEMENT — '+(m.message||'');announce.style.display='block';setTimeout(()=>announce.style.display='none',8000)}
    });
