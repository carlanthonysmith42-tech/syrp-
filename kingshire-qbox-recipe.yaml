  # ---- OX stack ----
  - action: download_file
    path: ./tmp/ox_lib.zip
    url: https://github.com/overextended/ox_lib/releases/latest/download/ox_lib.zip
  - action: unzip
    src: ./tmp/ox_lib.zip
    dest: ./resources/[ox]
  - action: download_file
    path: ./tmp/ox_target.zip
    url: https://github.com/overextended/ox_target/releases/latest/download/ox_target.zip
  - action: unzip
    src: ./tmp/ox_target.zip
    dest: ./resources/[ox]
  - action: download_file
    path: ./tmp/oxmysql.zip
    url: https://github.com/overextended/oxmysql/releases/latest/download/oxmysql.zip
  - action: unzip
    src: ./tmp/oxmysql.zip
    dest: ./resources/[ox]
  - action: download_file
    path: ./tmp/ox_doorlock.zip
    url: https://github.com/overextended/ox_doorlock/releases/latest/download/ox_doorlock.zip
  - action: unzip
    src: ./tmp/ox_doorlock.zip
    dest: ./resources/[ox]
  - action: download_file
    path: ./tmp/ox_inventory.zip
    url: https://github.com/overextended/ox_inventory/releases/latest/download/ox_inventory.zip
  - action: unzip
    src: ./tmp/ox_inventory.zip
    dest: ./resources/[ox]
  - action: move_path
    src: ./tmp/qbox/items.lua
    dest: ./resources/[ox]/ox_inventory/data/items.lua
    overwrite: true
  - action: download_github
    src: https://github.com/overextended/ox_fuel
    ref: main
    dest: ./resources/[ox]/ox_fuel

  # ---- NPWD ----
  - action: download_file
    path: ./tmp/npwd.zip
    url: https://github.com/project-error/npwd/releases/download/3.14.3/npwd.zip
  - action: unzip
    src: ./tmp/npwd.zip
    dest: ./resources/[npwd]/
  - action: query_database
    file: ./resources/[npwd]/npwd/import.sql
  - action: download_github
    src: https://github.com/Qbox-project/qbx_npwd
    ref: main
    dest: ./resources/[npwd]/qbx_npwd
  - action: move_path
    src: ./resources/[npwd]/qbx_npwd/config.json
    dest: ./resources/[npwd]/npwd/config.json
    overwrite: true
  - action: download_file
    path: ./tmp/npwd_qbx_mail.zip
    url: https://github.com/Qbox-project/npwd_qbx_mail/releases/latest/download/npwd_qbx_mail.zip
  - action: unzip
    src: ./tmp/npwd_qbx_mail.zip
    dest: ./resources/[npwd-apps]

  # ---- KingshireRP folders and server branding ----
  - action: ensure_dir
    path: ./resources/[vehicles]
  - action: ensure_dir
    path: ./resources/[maps]
  - action: ensure_dir
    path: ./resources/[clothing]
  - action: ensure_dir
    path: ./resources/[eup]
  - action: ensure_dir
    path: ./resources/[kingshire]
  - action: write_file
    file: ./kingshire.cfg
    data: |
      # KingshireRP custom server branding
      # Edit this file after deployment to add your Discord invite or change wording.
      sv_hostname "KingshireRP | UK Roleplay"
      sets sv_projectName "KingshireRP | UK Roleplay"
      sets sv_projectDesc "Serious UK roleplay built on Qbox - police, NHS, fire, civilian and criminal roleplay."
      sets tags "ukrp,kingshire,qbox,roleplay,british,police,nhs,fire,civilian"
      sets locale "en-GB"
      set qbx:discordLink ""
      setr sv_showBusySpinnerOnLoadingScreen false
      setr qbx:motd "<p style='padding:1rem;background:#07111d;border:1px solid #1e78b7;border-radius:.5rem;text-align:center;color:#fff'><strong>Welcome to KingshireRP</strong><br>Serious UK roleplay. Create great scenes and respect the community.</p>"
  - action: write_file
    file: ./server.cfg
    append: true
    data: |
      # KingshireRP custom additions
      exec kingshire.cfg
      ensure [kingshire]
      ensure [vehicles]
      ensure [maps]
      ensure [clothing]
      ensure [eup]

  # ---- Cleanup ----
  - action: remove_path
    path: ./tmp
