$engine: 3
$onesync: on
name: KingshireRP Qbox
version: 1.0.0
author: KingshireRP
description: Qbox Stable base with KingshireRP UK branding, custom loading screen and ready-made custom resource folders.

tasks:
  # ---- Base Qbox files ----
  - action: download_github
    src: https://github.com/Qbox-project/txAdminRecipe
    ref: main
    dest: ./tmp/qbox

  - action: move_path
    src: ./tmp/qbox/server.cfg
    dest: ./server.cfg

  - action: move_path
    src: ./tmp/qbox/permissions.cfg
    dest: ./permissions.cfg

  - action: move_path
    src: ./tmp/qbox/ox.cfg
    dest: ./ox.cfg

  - action: move_path
    src: ./tmp/qbox/voice.cfg
    dest: ./voice.cfg

  - action: move_path
    src: ./tmp/qbox/misc.cfg
    dest: ./misc.cfg

  - action: move_path
    src: ./tmp/qbox/myLogo.png
    dest: ./myLogo.png

  # ---- Database ----
  - action: connect_database

  - action: query_database
    file: ./tmp/qbox/qbox.sql

  # ---- CFX defaults / standalone ----
  - action: download_github
    src: https://github.com/citizenfx/cfx-server-data
    subpath: resources
    dest: ./resources/[cfx-default]
  - action: remove_path
    path: ./resources/[cfx-default]/[gameplay]/chat
  - action: download_github
    src: https://github.com/Bob74/bob74_ipl
    ref: master
    dest: ./resources/[standalone]/bob74_ipl
  - action: download_github
    src: https://github.com/qbox-project/safecracker
    ref: main
    dest: ./resources/[standalone]/safecracker
  - action: download_file
    path: ./tmp/screencapture.zip
    url: https://github.com/itschip/screencapture/releases/latest/download/screencapture.zip
  - action: unzip
    src: ./tmp/screencapture.zip
    dest: ./resources/[standalone]/
  - action: download_github
    src: https://github.com/qbox-project/mhacking
    ref: main
    dest: ./resources/[standalone]/mhacking
  - action: download_github
    src: https://github.com/Scullyy/scully_emotemenu
    ref: main
    dest: ./resources/[standalone]/scully_emotemenu
  - action: download_github
    src: https://github.com/ultrahacx/ultra-voltlab
    ref: main
    dest: ./resources/[standalone]/ultra-voltlab
  - action: download_file
    path: ./tmp/Renewed-Banking.zip
    url: https://github.com/Renewed-Scripts/Renewed-Banking/releases/latest/download/Renewed-Banking.zip
  - action: unzip
    src: ./tmp/Renewed-Banking.zip
    dest: ./resources/[standalone]
  - action: download_file
    path: ./tmp/illenium-appearance.zip
    url: https://github.com/iLLeniumStudios/illenium-appearance/releases/latest/download/illenium-appearance.zip
  - action: unzip
    src: ./tmp/illenium-appearance.zip
    dest: ./resources/[standalone]
  - action: download_github
    src: https://github.com/BaziForYou/MugShotBase64
    ref: main
    subpath: MugShotBase64
    dest: ./resources/[standalone]/MugShotBase64
  - action: download_file
    path: ./resources/[standalone]/MugShotBase64/README.md
    url: https://raw.githubusercontent.com/BaziForYou/MugShotBase64/main/README.md
  - action: download_file
    path: ./resources/[standalone]/MugShotBase64/LICENSE.md
    url: https://raw.githubusercontent.com/BaziForYou/MugShotBase64/main/LICENSE.md
  - action: download_file
    path: ./tmp/mana_audio.zip
    url: https://github.com/Manason/mana_audio/releases/latest/download/mana_audio.zip
  - action: unzip
    src: ./tmp/mana_audio.zip
    dest: ./resources/[standalone]

  # ---- KingshireRP custom loading screen ----
  - action: ensure_dir
    path: ./resources/[kingshire]/kingshire_loadscreen/html
  - action: write_file
    file: ./resources/[kingshire]/kingshire_loadscreen/fxmanifest.lua
    data: |
      fx_version 'cerulean'
      game 'gta5'

      author 'KingshireRP'
      description 'KingshireRP custom FiveM loading screen'
      version '1.0.0'

      loadscreen 'html/index.html'
      loadscreen_cursor 'yes'

      files {
          'html/index.html',
          'html/style.css',
          'html/app.js'
      }
  - action: write_file
    file: ./resources/[kingshire]/kingshire_loadscreen/html/index.html
    data: |
      <!doctype html>
      <html lang="en">
      <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>KingshireRP</title>
        <link rel="stylesheet" href="style.css">
      </head>
      <body>
        <main class="screen">
          <div class="shade"></div>
          <header class="topbar">
            <div class="brand"><span class="dot"></span>KINGSHIRE RP</div>
            <div class="meta">UNITED KINGDOM ROLEPLAY</div>
          </header>

          <section class="welcome">
            <div class="eyebrow">WELCOME TO</div>
            <h1>KINGSHIRE RP</h1>
            <p>Serious UK roleplay • Police • NHS • Fire • Civilian • Criminal</p>
            <div id="player" class="player">Connecting to the city…</div>
          </section>

          <section class="loader">
            <div class="loader-row">
              <span id="status">Preparing KingshireRP…</span>
              <span id="percent">0%</span>
            </div>
            <div class="bar"><div id="barFill" class="bar-fill"></div></div>
            <div id="tip" class="tip">Tip: Keep your RP realistic and give every scene room to develop.</div>
          </section>
        </main>
        <script src="app.js"></script>
      </body>
      </html>
  - action: write_file
    file: ./resources/[kingshire]/kingshire_loadscreen/html/style.css
    data: |
      *{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#040b12;font-family:Inter,Segoe UI,Arial,sans-serif;color:#fff}.screen{position:relative;width:100%;height:100%;background:url('data:image/jpeg;base64,') center center/cover no-repeat}.shade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,8,18,.77) 0%,rgba(0,8,18,.28) 42%,rgba(0,8,18,.16) 66%,rgba(0,8,18,.55) 100%),linear-gradient(0deg,rgba(0,6,14,.82) 0%,transparent 46%,rgba(0,6,14,.45) 100%)}.topbar{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:30px 42px;letter-spacing:.28em;font-weight:700;font-size:13px;text-shadow:0 2px 16px #000}.brand{display:flex;align-items:center;gap:12px}.dot{width:9px;height:9px;border-radius:50%;background:#32b8ff;box-shadow:0 0 18px #32b8ff}.meta{opacity:.72}.welcome{position:absolute;left:5.5vw;bottom:19vh;max-width:640px;text-shadow:0 3px 24px rgba(0,0,0,.8)}.eyebrow{font-size:13px;letter-spacing:.36em;color:#62c8ff;font-weight:800;margin-bottom:8px}.welcome h1{font-size:clamp(38px,5vw,76px);line-height:.95;margin:0 0 15px;font-weight:900;letter-spacing:.02em}.welcome p{font-size:15px;letter-spacing:.08em;margin:0;color:rgba(255,255,255,.82)}.player{margin-top:13px;font-size:13px;color:rgba(255,255,255,.66)}.loader{position:absolute;left:5.5vw;right:5.5vw;bottom:5.3vh}.loader-row{display:flex;justify-content:space-between;margin-bottom:9px;font-size:12px;letter-spacing:.18em;text-transform:uppercase}.bar{height:7px;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.14);border-radius:999px;overflow:hidden;box-shadow:0 0 28px rgba(0,137,255,.18)}.bar-fill{height:100%;width:0;background:linear-gradient(90deg,#0f83ff,#71d5ff);box-shadow:0 0 18px rgba(55,184,255,.75);transition:width .22s ease}.tip{margin-top:11px;font-size:12px;color:rgba(255,255,255,.64);letter-spacing:.035em}@media(max-width:760px){.topbar{padding:22px}.meta{display:none}.welcome{left:7vw;right:7vw;bottom:22vh}.loader{left:7vw;right:7vw}.welcome p{font-size:13px}}
  - action: write_file
    file: ./resources/[kingshire]/kingshire_loadscreen/html/app.js
    data: |
      const fill=document.getElementById('barFill');
      const pct=document.getElementById('percent');
      const status=document.getElementById('status');
      const tip=document.getElementById('tip');
      const player=document.getElementById('player');
      const tips=[
       'Tip: Keep your RP realistic and give every scene room to develop.',
       'Tip: Value your character life and the lives of others.',
       'Tip: Use clear radio comms and avoid talking over priority traffic.',
       'Tip: Good roleplay is built together — create scenes, not just wins.',
       'Tip: Report bugs to staff rather than exploiting them.'
      ];
      let tipIndex=0;
      setInterval(()=>{tipIndex=(tipIndex+1)%tips.length;tip.textContent=tips[tipIndex]},4500);
      if(window.nuiHandoverData&&window.nuiHandoverData.name){player.textContent='Connecting as '+window.nuiHandoverData.name;}
      window.addEventListener('message',(event)=>{
       const data=event.data||{};
       if(data.eventName==='loadProgress'){
         const fraction=Math.max(0,Math.min(1,Number(data.loadFraction)||0));
         const value=Math.round(fraction*100);
         fill.style.width=value+'%';pct.textContent=value+'%';
         if(value<25)status.textContent='Loading KingshireRP resources…';
         else if(value<60)status.textContent='Preparing the city…';
         else if(value<90)status.textContent='Synchronising your session…';
         else status.textContent='Entering KingshireRP…';
       }
      });

  # ---- Voice ----
  - action: download_github
    src: https://github.com/AvarianKnight/pma-voice
    ref: main
    dest: ./resources/[voice]/pma-voice
  - action: download_file
    path: ./tmp/qbx_radio.zip
    url: https://github.com/qbox-project/qbx_radio/releases/latest/download/qbx_radio.zip
  - action: unzip
    src: ./tmp/qbx_radio.zip
    dest: ./resources/[qbx]

  # ---- Qbox stable resources ----
  - action: download_file
    path: ./tmp/qbx_core.zip
    url: https://github.com/qbox-project/qbx_core/releases/latest/download/qbx_core.zip
  - action: unzip
    src: ./tmp/qbx_core.zip
    dest: ./resources/[qbx]
  - action: query_database
    file: ./resources/[qbx]/qbx_core/qbx_core.sql
  - action: download_file
    path: ./tmp/qbx_vehicles.zip
    url: https://github.com/qbox-project/qbx_vehicles/releases/latest/download/qbx_vehicles.zip
  - action: unzip
    src: ./tmp/qbx_vehicles.zip
    dest: ./resources/[qbx]
  - action: query_database
    file: ./resources/[qbx]/qbx_vehicles/vehicles.sql
  - action: download_file
    path: ./tmp/qbx_management.zip
    url: https://github.com/qbox-project/qbx_management/releases/latest/download/qbx_management.zip
  - action: unzip
    src: ./tmp/qbx_management.zip
    dest: ./resources/[qbx]
  - action: download_file
    path: ./tmp/qbx_diving.zip
    url: https://github.com/qbox-project/qbx_diving/releases/latest/download/qbx_diving.zip
  - action: unzip
    src: ./tmp/qbx_diving.zip
    dest: ./resources/[qbx]
  - action: download_file
    path: ./tmp/qbx_divegear.zip
    url: https://github.com/qbox-project/qbx_divegear/releases/latest/download/qbx_divegear.zip
  - action: unzip
    src: ./tmp/qbx_divegear.zip
    dest: ./resources/[qbx]
  - action: waste_time
    seconds: 10
  - action: download_file
    path: ./tmp/qbx_binoculars.zip
    url: https://github.com/qbox-project/qbx_binoculars/releases/latest/download/qbx_binoculars.zip
  - action: unzip
    src: ./tmp/qbx_binoculars.zip
    dest: ./resources/[qbx]
  - action: download_file
    path: ./tmp/qbx_truckrobbery.zip
    url: https://github.com/qbox-project/qbx_truckrobbery/releases/latest/download/qbx_truckrobbery.zip
  - action: unzip
    src: ./tmp/qbx_truckrobbery.zip
    dest: ./resources/[qbx]
  - action: download_file
    path: ./tmp/Renewed-Weathersync.zip
    url: https://github.com/Renewed-Scripts/Renewed-Weathersync/releases/latest/download/Renewed-Weathersync.zip
  - action: unzip
    src: ./tmp/Renewed-Weathersync.zip
    dest: ./resources/[standalone]
  - action: download_file
    path: ./tmp/xt-prison.zip
    url: https://github.com/xT-Development/xt-prison/releases/latest/download/xt-prison.zip
  - action: unzip
    src: ./tmp/xt-prison.zip
    dest: ./resources/[standalone]
  - action: download_file
    path: ./tmp/vehiclehandler.zip
    url: https://github.com/QuantumMalice/vehiclehandler/releases/latest/download/vehiclehandler.zip
  - action: unzip
    src: ./tmp/vehiclehandler.zip
    dest: ./resources/[standalone]
  - action: download_file
    path: ./tmp/qbx_garages.zip
    url: https://github.com/qbox-project/qbx_garages/releases/latest/download/qbx_garages.zip
  - action: unzip
    src: ./tmp/qbx_garages.zip
    dest: ./resources/[qbx]
  - action: download_file
    path: ./tmp/qbx_smallresources.zip
    url: https://github.com/qbox-project/qbx_smallresources/releases/latest/download/qbx_smallresources.zip
  - action: unzip
    src: ./tmp/qbx_smallresources.zip
    dest: ./resources/[qbx]
  - action: download_file
    path: ./tmp/qbx_density.zip
    url: https://github.com/Qbox-project/qbx_density/releases/latest/download/qbx_density.zip
  - action: unzip
    src: ./tmp/qbx_density.zip
    dest: ./resources/[qbx]
  - action: download_file
    path: ./tmp/qbx_adminmenu.zip
    url: https://github.com/qbox-project/qbx_adminmenu/releases/latest/download/qbx_adminmenu.zip
  - action: unzip
    src: ./tmp/qbx_adminmenu.zip
    dest: ./resources/[qbx]
  - action: download_file
    path: ./tmp/qbx_hud.zip
    url: https://github.com/qbox-project/qbx_hud/releases/latest/download/qbx_hud.zip
  - action: unzip
    src: ./tmp/qbx_hud.zip
    dest: ./resources/[qbx]
  - action: download_file
    path: ./tmp/qbx_spawn.zip
    url: https://github.com/qbox-project/qbx_spawn/releases/latest/download/qbx_spawn.zip
  - action: unzip
    src: ./tmp/qbx_spawn.zip
    dest: ./resources/[qbx]
  - action: download_file
    path: ./tmp/qbx_customs.zip
    url: https://github.com/qbox-project/qbx_customs/releases/latest/download/qbx_customs.zip
